
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and responsive Celsius to Fahrenheit temperature converter.">
    <title>Temperature Converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .formula {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
            color: #1e40af;
            font-size: 14px;
        }

        .clear-button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures instantly</p>

        <div class="input-group">
            <label for="celsius">Celsius (°C)</label>
            <input
                type="number"
                id="celsius"
                placeholder="Enter Celsius temperature"
                step="any"
            >
        </div>

        <div class="input-group">
            <label for="fahrenheit">Fahrenheit (°F)</label>
            <input
                type="number"
                id="fahrenheit"
                placeholder="Enter Fahrenheit temperature"
                step="any"
            >
        </div>

        <div class="formula">
            °F = (°C × 9/5) + 32
            <br><br>
            °C = (°F − 32) × 5/9
        </div>

        <button class="clear-button" id="clearButton" type="button">
            Clear
        </button>

        <footer>
            Temperature Converter | HTML, CSS & JavaScript
        </footer>
    </main>

    <script>
        const celsiusInput = document.getElementById("celsius");
        const fahrenheitInput = document.getElementById("fahrenheit");
        const clearButton = document.getElementById("clearButton");

        celsiusInput.addEventListener("input", function () {
            const celsius = parseFloat(celsiusInput.value);

            if (celsiusInput.value.trim() === "" || !Number.isFinite(celsius)) {
                fahrenheitInput.value = "";
                return;
            }

            const fahrenheit = (celsius * 9 / 5) + 32;
            fahrenheitInput.value = fahrenheit.toFixed(2);
        });

        fahrenheitInput.addEventListener("input", function () {
            const fahrenheit = parseFloat(fahrenheitInput.value);

            if (fahrenheitInput.value.trim() === "" || !Number.isFinite(fahrenheit)) {
                celsiusInput.value = "";
                return;
            }

            const celsius = (fahrenheit - 32) * 5 / 9;
            celsiusInput.value = celsius.toFixed(2);
        });

        clearButton.addEventListener("click", function () {
            celsiusInput.value = "";
            fahrenheitInput.value = "";
        });
    </script>

</body>
</html>
